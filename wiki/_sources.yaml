# wiki 来源映射清单（单真源）
#
# 用途：把每篇 wiki 文档与它派生自的 nix 模块 + 关联的 memory 决策卡显式绑定。
# 正向表：doc -> {sources: [.nix ...], memory: [卡 slug ...]}。
# 反向映射（nix -> docs）由 wiki-maintainer skill / doc-sync hook 从本表实时计算，不手维。
#
# 不变式（由 hook/skill 校验）：
#   1. 每个 host/*.nix 与 home/**/*.nix 模块至少被一篇文档的 sources 引用。
#   2. 每篇文档 sources 里列出的文件均真实存在。
#   3. 每篇文档 memory 里列出的卡在 memory/cards/<slug>.md 存在。
#
# 2026-08-12 重构：host/ 拆分 base+hyprland，GNOME 变体移至 specialisation/gnome/。
# 工作流：改了某个 .nix -> 反查本表得到「应更新文档集」-> 按 wiki 三方合并规则更新正文 + 刷新 frontmatter updated。
# 新增/删除 wiki 文档或新增 nix 模块时，必须同步本清单。

docs:
  overview.md:
    sources: [flake.nix, host/default.nix, home/base.nix, home/env/systools.nix, home/productivity/files.nix, home/productivity/comms.nix, home/git.nix]
    memory:  [flake-unstable-strategy]

  architecture/index.md:
    sources: [flake.nix, host/default.nix, home/base.nix, home/hyprland.nix, home/dev/default.nix, home/env/default.nix, home/productivity/default.nix, home/leisure/default.nix]
    memory:  [flake-unstable-strategy]
  architecture/flake.md:
    sources: [flake.nix, host/base/nix.nix]
    memory:  [flake-unstable-strategy]
  architecture/host.md:
    sources: [host/default.nix, host/base/default.nix, host/hyprland/default.nix, host/base/boot.nix, host/base/hardware.nix, host/hyprland/greeter.nix, host/base/users.nix, host/base/locale.nix]
    memory:  [amd-kernel-stay-lts, mechrevo-amd-backlight-curve]

  desktop/hyprland.md:
