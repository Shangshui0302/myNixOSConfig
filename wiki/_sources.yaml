    memory:  [fcitx5-vertical-candidates, portal-gtk-dangling-symlink]
  desktop/noctalia.md:
    sources: [home/hyprland/noctalia.nix, host/hyprland/greeter.nix]
    memory:  []
  desktop/shell.md:
